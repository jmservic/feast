version: "2"
sql:
  - schema: "sql/schema"
    queries: "sql/queries"
    engine: "postgresql"
    gen:
      go:
        package: "database"
        sql_package: "pgx/v5"
        out: "internal/database"
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "pg_catalog.timestamp"
            go_type: "time.Time"
          - db_type: "pg_catalog.timestamp"
            nullable: true
            go_type: "time.Time"
          - db_type: "pg_catalog.int4"
            go_type: "int"
          - db_type: "pg_catalog.int4"
            nullable: true
            go_type: "int"
          - db_type: "serial"
            go_type: "int"
          - db_type: "pg_catalog.numeric"
            go_type: 
              import: "github.com/shopspring/decimal"
              type: "Decimal"
          - db_type: "pg_catalog.numeric"
            nullable: true       
            go_type: 
              import: "github.com/shopspring/decimal"
              type: "Decimal"
          - db_type: "serving_info"
            go_type: 
              import: "github.com/jmservic/feast/internal/dto"
              type: "ServingInfo"
